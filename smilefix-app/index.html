<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SmileFix — Professional Dental Clinic Management System" />
    <title>SmileFix — Dental Precision</title>
    <!-- Anti-flash: apply saved theme before React renders -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('smilefix-theme') || 'light';
          document.documentElement.classList.toggle('dark', t === 'dark');
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
