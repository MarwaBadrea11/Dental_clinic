name: CI - SmileFix Safety Net

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'dental-clinic-backend/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'dental-clinic-backend/**'
      - '.github/workflows/ci.yml'

# Cancel in-progress runs for the same workflow and ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    # Set up PostgreSQL service for tests
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smilefix_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    defaults:
      run:
        working-directory: ./dental-clinic-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dental-clinic-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate test JWT keys
        run: |
          # Generate RS256 key pair for tests
          openssl genrsa -out /tmp/private.key 2048
          openssl rsa -in /tmp/private.key -pubout -out /tmp/public.key
          
          # Store as multiline secrets for env
          echo "JWT_PRIVATE_KEY<<EOF" >> $GITHUB_ENV
          cat /tmp/private.key >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          
          echo "JWT_PUBLIC_KEY<<EOF" >> $GITHUB_ENV
          cat /tmp/public.key >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create .env for tests
        run: |
          cat > .env << 'EOF'
          NODE_ENV=test
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/smilefix_test
          PORT=3000
          
          # JWT Configuration (from generated keys)
          JWT_PRIVATE_KEY=${{ env.JWT_PRIVATE_KEY }}
          JWT_PUBLIC_KEY=${{ env.JWT_PUBLIC_KEY }}
          JWT_ACCESS_EXPIRY=15m
          JWT_REFRESH_EXPIRY=7d
          
          # Security
          BCRYPT_ROUNDS=10
          
          # CORS
          CORS_ORIGIN=http://localhost:5173,http://localhost:5174
          
          # Rate Limiting
          RATE_LIMIT_MAX=100
          
          # File Uploads
          UPLOAD_DIR=uploads
          MAX_FILE_SIZE=52428800
          
          # License (test mode)
          MASTER_LICENSE_SERVER_URL=http://localhost:8000
          LICENSE_GRACE_PERIOD_DAYS=7
          LICENSE_BACKGROUND_CHECK_INTERVAL=3600000
          EOF

      - name: Run database migrations
        run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smilefix_test

      - name: Run tests
        run: npm test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smilefix_test

      - name: Upload test coverage (if available)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage
          path: dental-clinic-backend/coverage/
          if-no-files-found: ignore
          retention-days: 7

  lint-and-format:
    name: Code Quality
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./dental-clinic-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dental-clinic-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check for syntax errors
        run: |
          echo "Running basic syntax validation..."
          node --check src/**/*.js || echo "Note: Some files may have syntax issues"
        continue-on-error: true

  all-checks-passed:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [backend-tests, lint-and-format]
    if: always()
    
    steps:
      - name: Verify all jobs passed
        run: |
          if [ "${{ needs.backend-tests.result }}" != "success" ]; then
            echo "❌ Backend tests failed"
            exit 1
          fi
          
          if [ "${{ needs.lint-and-format.result }}" != "success" ] && [ "${{ needs.lint-and-format.result }}" != "skipped" ]; then
            echo "⚠️  Lint job had issues (non-blocking for now)"
          fi
          
          echo "✅ All required checks passed!"
